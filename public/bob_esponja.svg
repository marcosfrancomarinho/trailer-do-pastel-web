    <path d="M408 271q38 23 54 59" fill="none" stroke="#f6d12f" stroke-width="16"/>
    <path d="M49 328q-17-11-19 4-5 16 11 21 18 6 28-12zM462 328q17-11 19 4 5 16-11 21-18 6-28-12z" fill="#f6d12f"/>
