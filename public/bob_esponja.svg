      <ellipse cx="142" cy="109" rx="16" ry="11" transform="rotate(-20 142 109)"/>
      <ellipse cx="367" cy="113" rx="13" ry="19" transform="rotate(25 367 113)"/>
      <ellipse cx="120" cy="218" rx="10" ry="16"/>
      <ellipse cx="388" cy="221" rx="14" ry="10"/>
      <ellipse cx="150" cy="279" rx="14" ry="10"/>
      <ellipse cx="365" cy="290" rx="11" ry="15"/>
    </g>
    <!-- shirt -->
    <path d="M108 314h303l-7 48H113z" fill="#fff"/>
    <!-- pants -->
    <path d="M113 362h291l-7 44H120z" fill="#a36939"/>
    <path d="M113 366h291" fill="none"/>
    <path d="M172 375h30m103 0h30" stroke="#252122" stroke-width="10"/>
