    <ellipse cx="307" cy="172" rx="57" ry="66" fill="#fff"/>
    <circle cx="222" cy="177" r="23" fill="#70c6ed"/>
    <circle cx="290" cy="177" r="23" fill="#70c6ed"/>
    <circle cx="228" cy="181" r="12" fill="#171a1b" stroke="none"/>
    <circle cx="284" cy="181" r="12" fill="#171a1b" stroke="none"/>
    <circle cx="232" cy="173" r="5" fill="#fff" stroke="none"/>
    <circle cx="288" cy="173" r="5" fill="#fff" stroke="none"/>
    <!-- eyelashes -->
    <path d="M175 113l-10-19m31 10-3-21m29 23 7-20m57 20-8-20m29 18 3-21m20 30 11-19" fill="none"/>
    <!-- cheeks -->
    <ellipse cx="155" cy="249" rx="28" ry="17" fill="#f9a285" stroke="none" opacity=".78"/>
    <ellipse cx="355" cy="249" rx="28" ry="17" fill="#f9a285" stroke="none" opacity=".78"/>
    <g fill="#d56652" stroke="none"><circle cx="145" cy="245" r="3"/><circle cx="159" cy="252" r="3"/><circle cx="365" cy="245" r="3"/><circle cx="351" cy="252" r="3"/></g>
