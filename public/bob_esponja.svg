<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Bob Esponja</title>
  <desc id="desc">Ilustração vetorial estilizada do Bob Esponja sorrindo.</desc>
  <g stroke="#493328" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
