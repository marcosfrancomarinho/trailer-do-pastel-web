    <!-- smile -->
    <path d="M157 257q98 99 199 0" fill="none" stroke-width="8"/>
    <path d="M202 284q52 45 104 0" fill="#8d332e" stroke-width="3"/>
    <!-- two teeth -->
    <path d="M232 290v31q10 5 22 0v-29m4 0v29q12 5 22 0v-31" fill="#fff" stroke-width="4"/>
    <path d="M149 252q-8 0-13 8m229-8q8 0 13 8" fill="none" stroke-width="4"/>
