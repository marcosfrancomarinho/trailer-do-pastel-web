    <path d="M225 316l30 21-29 12-25-30m86-3-30 21 29 12 25-30" fill="#fff"/>
    <path d="M254 337l-13 17 13 11 13-11zm0 28-16 28 16 9 16-9z" fill="#ed3934"/>
